<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>8-р анги · 4.3 Нуур</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@700;800&display=swap">
<style>/* Интерактив хичээлийн нэгдсэн загвар. Өнгийг хичээл бүрийн theme-ээс (--bg, --c1, --c2, --c3) авна. */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 22px/1.45 'Onest','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:root{--ink:#f4f7fb;--muted:rgba(244,247,251,.68);--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.07);--ok:#3ddc97;--bad:#ff6b6b;--disp:'Unbounded','Segoe UI',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
b,strong{font-weight:700;color:var(--hi)}
mark{background:none;color:var(--c2);font-weight:700}

/* Дэвсгэр: сэдвийн хээ + гэрэл */
#bgfx{position:fixed;inset:0;pointer-events:none}
#bgfx .glow{position:absolute;inset:0;background:radial-gradient(1000px 700px at 85% 0%,color-mix(in srgb,var(--c1) 38%,transparent),transparent 60%),radial-gradient(900px 600px at 0% 100%,color-mix(in srgb,var(--c2) 26%,transparent),transparent 60%)}
#bgfx .motif{position:absolute;inset:0;opacity:.55}

/* 16:9 тайз, цонхонд багтааж томруулна */
#stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--disp);letter-spacing:.02em;white-space:nowrap;margin-right:6px;min-width:0;max-width:300px;flex:0 1 auto}
.brand span{overflow:hidden;text-overflow:ellipsis}
.brand i{font-style:normal;font-size:24px}
.chips{display:flex;gap:6px;flex:1;min-width:0}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.18);font:600 13px/1.1 'Onest',sans-serif;color:var(--muted);white-space:nowrap;cursor:pointer;transition:.2s}
.chip small{opacity:.75;font-weight:500}
.chip.on{background:var(--sc);border-color:var(--sc);color:#10131c}
.chip.done{color:var(--ink);border-color:color-mix(in srgb,var(--sc) 60%,transparent)}
.clock{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 14px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line);font:700 17px/1 'Onest',monospace;font-variant-numeric:tabular-nums}
.clock .tot{color:var(--muted);font-weight:500;font-size:14px}
.clock.over{border-color:var(--bad);color:var(--bad)}
.clock button{border:0;background:var(--c1);color:#10131c;border-radius:999px;width:30px;height:30px;font-size:13px;display:grid;place-items:center}

.view{position:relative;flex:1;min-height:0;margin:12px 22px 0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .35s,transform .35s,visibility .35s}
.slide.on{opacity:1;visibility:visible;transform:none}
.s-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.s-chip{font:800 13px var(--disp);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--sc);color:#10131c;white-space:nowrap}
.s-head h2{margin:0;font:800 34px/1.1 var(--disp);letter-spacing:-.01em}
.s-body{flex:1;min-height:0;display:flex;gap:26px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.col.vis{flex:1.05;align-items:center;justify-content:center}
.vis svg,.vis img{max-width:100%;max-height:100%}
.vis .frame{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:14px}
.txt p{margin:0 0 12px}
.txt ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.txt li{position:relative;padding-left:30px}
.txt li::before{content:'';position:absolute;left:6px;top:.55em;width:12px;height:12px;border-radius:4px;background:var(--sc);transform:rotate(45deg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;backdrop-filter:blur(6px)}
.big-q{font:800 36px/1.2 var(--disp);margin:0 0 16px}
.hook-s .big-q{font-size:31px}
.poll{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.poll .opt{min-height:58px;font-size:20px;padding:10px 14px}
.poll .cnt{margin-left:auto;font:800 24px Onest,sans-serif;color:var(--c2)}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:14px;padding:11px 20px;font-weight:700;font-size:19px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.pri{background:var(--c1);border-color:var(--c1);color:#10131c}
.btn.pri:hover{filter:brightness(1.1)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reveal-box{display:none}
.reveal-box.on{display:block;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}

/* Нүүр */
.title-s .s-body{align-items:center}
.title-s .kicker{font:700 16px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--c2);margin-bottom:12px}
.title-s h1{margin:0 0 18px;font:800 76px/1.02 var(--disp);letter-spacing:-.02em}
.title-s h1 span{color:var(--c1)}
.title-s .meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.title-s .meta span{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:16px;font-weight:600}

/* Зорилго */
.goals{display:grid;gap:14px;counter-reset:g}
.goals li{list-style:none;display:flex;gap:16px;align-items:center;padding:16px 20px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:24px}
.goals li::before{counter-increment:g;content:counter(g);flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sc);color:#10131c;font:800 20px var(--disp)}

/* Нэр томьёо */
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term{border:1px dashed color-mix(in srgb,var(--c2) 70%,transparent);background:color-mix(in srgb,var(--c2) 12%,transparent);color:var(--ink);border-radius:12px;padding:7px 12px;font-weight:700;font-size:17px}
.term.on{border-style:solid;background:color-mix(in srgb,var(--c2) 26%,transparent)}
.def{min-height:62px;font-size:19px}

/* Эргэдэг карт */
.cards{display:grid;gap:16px;width:100%;grid-template-columns:repeat(var(--n,3),1fr);grid-auto-rows:minmax(200px,1fr);flex:1;min-height:0;max-height:470px;margin:auto 0}
.flip{perspective:1000px;height:100%;min-height:200px;border:0;background:none;padding:0;text-align:center}
.flip .in{position:relative;width:100%;height:100%;min-height:200px;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;border:1px solid var(--line)}
.flip .f{background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 30%,transparent),rgba(255,255,255,.05))}
.flip .f .ic{font-size:64px;line-height:1}
.flip .f .ic svg{display:block;max-height:220px}
.flip .f b{font:800 23px/1.15 var(--disp);color:var(--ink)}
.flip .b{transform:rotateY(180deg);background:rgba(10,14,28,.88);font-size:19px;line-height:1.35}

/* Хүснэгт */
.tbl{width:100%;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;font-size:19px}
.tbl th{background:color-mix(in srgb,var(--c1) 40%,rgba(0,0,0,.4));padding:11px 14px;text-align:left;font-weight:700}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);background:rgba(255,255,255,.04);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--c2)}
.tbl td.hide{cursor:pointer;color:transparent;text-shadow:0 0 12px rgba(255,255,255,.6);user-select:none}
.tbl td.hide *{color:transparent!important;text-shadow:0 0 12px rgba(255,255,255,.6)}
.tbl td.hide::after{content:'👆';color:var(--ink);text-shadow:none;margin-left:6px;font-size:15px}

/* Цэгтэй зураг */
.hot{position:relative;display:inline-block;max-width:100%;max-height:100%}
.hot>svg{display:block}
.spot{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:3px solid #fff;background:var(--c1);color:#10131c;font:800 17px var(--disp);display:grid;place-items:center;box-shadow:0 0 0 6px color-mix(in srgb,var(--c1) 35%,transparent);animation:pulse 2s infinite}
.spot.seen{background:var(--c2);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--c1) 10%,transparent)}}
.spot-info{min-height:120px}
.spot-info h3{margin:0 0 6px;font:800 24px var(--disp);color:var(--c2)}

/* Алхмууд */
.steps{display:flex;gap:12px;align-items:stretch;flex:1;max-height:400px;min-height:0}
.step{flex:1;border-radius:18px;padding:16px;background:var(--card);border:1px solid var(--line);opacity:.18;transition:.35s;position:relative}
.step.on{opacity:1;border-color:color-mix(in srgb,var(--sc) 70%,transparent)}
.step .ic{font-size:56px;line-height:1.1}
.step h3{margin:10px 0 8px;font:800 23px/1.2 var(--disp)}
.step p{margin:0;font-size:19px;line-height:1.4}
.step .no{position:absolute;top:10px;right:14px;font:800 18px var(--disp);color:var(--sc)}

/* Тоглоом */
.game-q{font:800 34px/1.22 var(--disp);margin:0 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:rgba(255,255,255,.06);border-radius:18px;padding:14px 18px;font-size:22px;font-weight:600;min-height:76px;transition:.15s}
.opt:hover{border-color:var(--c1)}
.opt .k{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sc);color:#10131c;font:800 18px var(--disp)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.opt.ok .k{background:var(--ok)}.opt.no .k{background:var(--bad)}
.expl{margin-top:14px;font-size:20px;padding:12px 16px;border-radius:14px;background:rgba(0,0,0,.25);border-left:5px solid var(--ok)}
.qcount{font:700 15px var(--disp);color:var(--muted);letter-spacing:.08em}
.tf-btns{display:flex;gap:16px;margin-top:8px}
.tf-btns .opt{flex:1;justify-content:center;font:800 30px var(--disp);min-height:110px}
.pool,.bins{display:flex;flex-wrap:wrap;gap:10px}
.chipw{border:2px solid var(--line);background:rgba(255,255,255,.08);border-radius:14px;padding:10px 16px;font-size:20px;font-weight:600;transition:.15s}
.chipw.sel{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 25%,transparent);transform:translateY(-2px)}
.chipw.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent);cursor:default}
.bins{flex-wrap:nowrap;align-items:stretch;flex:1;min-height:0}
.bin{flex:1;display:flex;flex-direction:column;gap:8px;border:2px dashed var(--line);border-radius:20px;padding:12px;background:rgba(0,0,0,.14);min-height:0;overflow:auto}
.bin h3{margin:0 0 4px;font:800 21px var(--disp);color:var(--c2);text-align:center}
.bin.hover{border-color:var(--c1)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;align-content:start}
.match .chipw{text-align:left;width:100%}
.order{display:flex;flex-direction:column;gap:8px;max-width:820px}
.order.many{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows),auto);grid-template-columns:1fr 1fr;column-gap:16px;max-width:none}
.order .it{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:9px 12px;background:rgba(255,255,255,.06);font-size:20px;font-weight:600}
.order .it .n{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--sc);color:#10131c;font:800 16px var(--disp)}
.order .it span.t{flex:1}
.order .it button{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:10px;width:40px;height:36px;font-size:16px}
.order .it.ok{border-color:var(--ok)}.order .it.no{border-color:var(--bad)}
.fill-t{font-size:25px;line-height:2.05}
.blank{display:inline-block;min-width:150px;border:0;border-bottom:3px solid var(--c1);background:rgba(255,255,255,.06);border-radius:8px 8px 0 0;padding:0 12px;margin:0 4px;font-weight:700;color:var(--c2);text-align:center;line-height:1.5}
.blank.sel{background:color-mix(in srgb,var(--c1) 25%,transparent)}
.blank.ok{border-color:var(--ok);color:var(--ok)}.blank.no{border-color:var(--bad);color:var(--bad)}

/* Багийн оноо */
.teams{display:none!important;align-items:center;gap:8px;padding:8px 22px 0}
body.game .teams{display:none!important}
.qcount{display:none!important}
.team{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:14px;background:rgba(0,0,0,.28);border:2px solid var(--tc);font-weight:700;font-size:17px}
.team .sc{min-width:34px;text-align:center;font:800 24px Onest,sans-serif;color:var(--tc);font-variant-numeric:tabular-nums}
.team button{border:0;border-radius:9px;width:30px;height:30px;background:rgba(255,255,255,.12);font-weight:800}
.team button.plus{background:var(--tc);color:#10131c}
.team.bump{animation:pop .35s}
.teams .set{margin-left:auto;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.teams .set button{border:1px solid var(--line);background:none;border-radius:8px;width:28px;height:28px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:22px;flex:1}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px;width:180px}
.pod .bar{width:100%;border-radius:18px 18px 6px 6px;background:var(--tc);display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font:800 34px var(--disp);color:#10131c;transition:height .8s}
.pod b{font-size:21px;color:var(--ink)}

/* Тест */
.test{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;overflow:auto;align-content:start;padding-right:6px}
.tq{border-radius:16px;padding:9px 14px;background:var(--card);border:1px solid var(--line)}
.tq h4{margin:0 0 4px;font-size:17px;line-height:1.25}
.tq h4 span{color:var(--sc);font-family:var(--disp)}
.tq ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.tq li{font-size:15.5px;padding:1px 8px;border-radius:8px;line-height:1.25}
.tq li b{color:var(--c2);margin-right:6px}
.test.show .tq li.ok{background:color-mix(in srgb,var(--ok) 25%,transparent);font-weight:700}
.tq .e{display:none;font-size:15px;color:var(--muted);margin-top:6px}
.test.show .tq .e{display:block}

/* Дүгнэлт */
.points{display:grid;gap:12px}
.points li{list-style:none;display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:22px;opacity:.15;transition:.35s}
.points li.on{opacity:1}
.points li::before{content:'✓';flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sc);color:#10131c;font-weight:900}

/* Доод мөр */
.bottom{display:flex;align-items:center;gap:10px;padding:10px 22px 14px}
.bottom .dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.bottom .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer}
.bottom .dots i.st{background:var(--sc)}
.bottom .dots i.on{outline:2px solid #fff;outline-offset:2px}
.count{font:700 15px var(--disp);color:var(--muted);min-width:64px;text-align:center}
.tool{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:12px;height:42px;padding:0 14px;font-weight:700;font-size:16px}
.tool.pri{background:var(--c1);border-color:var(--c1);color:#10131c;padding:0 22px}

/* Багшийн тэмдэглэл */
.notes{position:absolute;left:22px;right:22px;bottom:66px;max-height:44%;overflow:auto;background:rgba(8,10,20,.94);border:1px solid var(--line);border-radius:18px;padding:16px 20px;font-size:18px;display:none;z-index:5}
body.shownotes .notes{display:block}
.notes h4{margin:0 0 6px;font:800 15px var(--disp);letter-spacing:.08em;color:var(--c2);text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#10131c;border:1px solid var(--line);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;font-size:16px;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

/* Газрын зураг */
.map-col{flex:1.65;position:relative;gap:0}
.lmap{flex:1;min-height:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#16263a}
.map-side{flex:1;gap:12px}
.base-sw{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:4px;background:rgba(10,14,28,.78);padding:4px;border-radius:12px}
.base-sw button{border:0;background:none;color:#fff;font:600 13px Onest,sans-serif;padding:6px 10px;border-radius:9px}
.base-sw button.on{background:var(--c1);color:#10131c}
.map-list{display:flex;flex-wrap:wrap;gap:6px}
.map-list button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:6px 10px;font-size:15px;font-weight:600;text-align:left}
.map-list button b{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);font-size:13px}
.map-list button.seen b{background:var(--c2);color:#10131c}
.map-list button.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 22%,transparent)}
.map-info{min-height:110px;font-size:18px;line-height:1.4}
.map-info h3{margin:0 0 6px;font:800 21px var(--disp);color:var(--c2)}
.map-err{height:100%;display:grid;place-items:center;text-align:center;padding:30px;font-size:20px;color:var(--muted)}
.mk span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--mc);border:3px solid #fff;color:#10131c;font:800 15px Onest,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.leaflet-container{font-family:Onest,'Segoe UI',sans-serif}
.leaflet-tooltip.map-tip{background:rgba(10,14,28,.88);color:#fff;border:0;border-radius:8px;font:700 14px Onest,sans-serif;padding:4px 8px;box-shadow:none}
.leaflet-tooltip.map-tip::before{display:none}
.mq-q{display:flex;flex-direction:column;gap:6px}
</style></head><body>
<script>// Интерактив хичээлийн нэгдсэн хөдөлгүүр (40 минут, 5 үе шат). Хичээл бүр LESSON({...}) гэж өгөгдлөө өгнө.
// Өгөгдлийн бүтэц: interaktiv/README.md. V.* нь сэдвийн зураг, график зурах туслахууд.
(function () {
  'use strict';
  const W = typeof window !== 'undefined' ? window : globalThis;

  const STAGES = [
    { n: 1, name: 'Сэдэлжүүлэх', min: 5, icon: '✨' },
    { n: 2, name: 'Шинэ мэдлэг', min: 15, icon: '📖' },
    { n: 3, name: 'Бататгах тоглоом', min: 12, icon: '🏆' },
    { n: 4, name: 'Үнэлгээ', min: 5, icon: '✅' },

    const g = c.getContext('2d'), cols = [L.theme.c1, L.theme.c2, L.theme.c3 || '#fff', '#fff'], ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * .55, vx: (Math.random() - .5) * 18, vy: -Math.random() * 18 - 6, s: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * 4)], r: Math.random() * 6 }));

      <div class="col" style="justify-content:center">${s.text ? `<div class="txt">${textBlock(s.text)}</div>` : ''}<div class="card spot-info"><p class="muted" style="margin:0">👆 Дугаартай цэг дээр дарна уу.</p></div></div></div>`,

      <div class="steps">${s.steps.map((p, i) => `<div class="step${i ? '' : ' on'}"><span class="no">${i + 1}</span><div class="ic">${p.icon || ''}</div><h3>${md(p.title)}</h3><p>${md(p.text || '')}</p></div>`).join('')}</div>

    enter(el) {
      const max = Math.max(1, ...teams.map(t => t.score)), order = teams.map((t, i) => Object.assign({ i }, t)).sort((a, b) => b.score - a.score);
      $('.podium', el).innerHTML = order.map((t, k) => `<div class="pod" style="--tc:${t.color}"><b>${k === 0 && t.score ? '👑 ' : ''}${esc(t.name)}</b><div class="bar" style="height:${40 + 300 * t.score / max}px">${t.score}</div></div>`).join('');
      if (order[0] && order[0].score) confetti();
    }
  });

  // --- Үнэлгээ (4-р үе шат): сурагч дэвтэртээ А/Б/В/Г гэж бичээд, багш хариуг нээнэ ---
  R.test = s => ({
    html: `${head(s)}<div class="s-body" style="flex-direction:column;gap:12px"><div class="test">${s.items.map((q, i) => { const opts = shuffle(q.a.map((t, k) => ({ t, ok: !k })), qid(s, i)); return `<div class="tq"><h4><span>${i + 1}.</span> ${md(q.q)}</h4><ol>${opts.map((o, k) => `<li class="${o.ok ? 'ok' : ''}"><b>${LETTERS[k]}</b>${md(o.t)}</li>`).join('')}</ol>${q.e ? `<div class="e">${md(q.e)}</div>` : ''}</div>`; }).join('')}</div>
      <div class="row"><button class="btn pri" data-a="sh">💡 Хариу харуулах</button><span class="muted" style="font-size:16px">Сурагчид хариугаа дэвтэртээ бичээд, дараа нь өөрсдөө шалгана.</span></div></div>`,
    init(el) { $('[data-a=sh]', el).onclick = () => $('.test', el).classList.toggle('show'); }
  });

  R.summary = s => ({
    html: `${head(s)}<div class="s-body"><div class="col" style="justify-content:center"><ul class="points" style="margin:0;padding:0">${s.points.map(p => `<li><span>${md(p)}</span></li>`).join('')}</ul><div class="row"><button class="btn pri" data-a="nx">Дараагийнх ▶</button><button class="btn" data-a="all">Бүгд</button></div></div>${s.visual ? `<div class="col vis" style="flex:.7">${visual(s.visual)}</div>` : ''}</div>`,
    init(el) { const ps = $$('.points li', el); $('[data-a=nx]', el).onclick = () => { const n = ps.findIndex(x => !x.classList.contains('on')); if (n >= 0) ps[n].classList.add('on'); }; $('[data-a=all]', el).onclick = () => ps.forEach(x => x.classList.add('on')); }
  });

  R.home = s => ({
    html: `${head(s)}<div class="s-body"><div class="col txt">${s.exit ? `<div class="card"><div class="muted" style="font-size:15px;margin-bottom:6px">🎟 ГАРАХ ТАСАЛБАР — хичээлээс гарахын өмнө хариулна</div><div style="font-size:24px;font-weight:700">${md(s.exit)}</div></div>` : ''}
      <div class="card"><div class="muted" style="font-size:15px;margin-bottom:6px">🏠 ГЭРИЙН ДААЛГАВАР</div>${textBlock(s.tasks)}</div></div>${s.visual ? `<div class="col vis" style="flex:.6">${visual(s.visual)}</div>` : ''}</div>`
  });

  /* ---------------- Газрын зураг (Leaflet, интернэт хэрэгтэй) ---------------- */
  // Суурь зураг: topo — газрын зураг (Esri), sat — хиймэл дагуул (Esri), relief — гадаргын хэлбэр (Esri), street — нутгийн нэр бүхий (CARTO, OSM)
  const BASES = {
    topo: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', 'Tiles © Esri', 'Газрын зураг', 18],
    sat: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Tiles © Esri, Maxar, Earthstar Geographics', 'Хиймэл дагуул', 18],
    relief: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', 'Tiles © Esri', 'Гадарга', 13],
    street: ['https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', '© OpenStreetMap contributors © CARTO', 'Нутгийн нэр', 18]
  };
  let leafP = null;
  const leaflet = () => leafP || (leafP = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = () => res(W.L); s.onerror = () => { leafP = null; rej(new Error('Газрын зураг ачаалагдсангүй. Интернэтээ шалгана уу.')); };
    document.head.appendChild(s);
  }));
  // Нэг газрын зургийг үүсгэх: bases — сонгох суурь зургууд, view — {center:[өргөрөг, уртраг], zoom} эсвэл {bounds:[[ө,у],[ө,у]]}
  function makeMap(Lf, box, s, onClick) {
    const map = Lf.map(box, { keyboard: false, zoomSnap: 0.25, worldCopyJump: true, attributionControl: true });
    const keys = (s.bases || ['topo', 'sat', 'street']).filter(k => BASES[k]);
    const layers = {};
    keys.forEach(k => { const [u, a, , mz] = BASES[k]; layers[k] = Lf.tileLayer(u, { attribution: a, maxNativeZoom: mz, maxZoom: 18, subdomains: 'abcd' }); });
    let cur = s.base && layers[s.base] ? s.base : keys[0];
    layers[cur].addTo(map);
    const v = s.view || {};
    if (v.bounds) map.fitBounds(v.bounds, { padding: [10, 10] }); else map.setView(v.center || [46.8, 103], v.zoom || 4);
    const sw = box.parentElement.querySelector('.base-sw');
    if (sw) {
      sw.innerHTML = keys.map(k => `<button data-b="${k}" class="${k === cur ? 'on' : ''}">${BASES[k][2]}</button>`).join('');
      sw.querySelectorAll('button').forEach(b => { b.onclick = () => { map.removeLayer(layers[cur]); cur = b.dataset.b; layers[cur].addTo(map); sw.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }; });
    }
    if (onClick) map.on('click', onClick);
    return map;
  }
  const pin = (Lf, n, color) => Lf.divIcon({ className: 'mk', html: `<span style="--mc:${color || 'var(--c1)'}">${n}</span>`, iconSize: [34, 34], iconAnchor: [17, 17] });
  const mapErr = (box, e) => { box.innerHTML = `<div class="map-err">🗺️ ${esc(e.message || e)}</div>`; };

  // Газрын зураг дээр зааж тайлбарлах: items [{title, text, at:[ө,у] | line:[[ө,у],…] | area:[[ө,у],…], color?, zoom?, label?, labelAt?:[ө,у], dir?:'left'|'right'|'top'|'bottom'}]
  R.map = s => {
    let map = null, Lf = null; const lay = [];
    const show = (el, i, fly) => {
      const it = s.items[i]; if (!it || !map) return;
      if (!lay[i]) {
        const c = it.color || ['#ffd43b', '#ff8c61', '#4dabf7', '#51cf66', '#cc5de8', '#ff6b6b'][i % 6];
        let g;
        if (it.at) g = Lf.marker(it.at, { icon: pin(Lf, i + 1, c) });
        else if (it.line) g = Lf.polyline(it.line, { color: c, weight: 4, dashArray: it.dash ? '10 8' : null });
        else if (it.area) g = Lf.polygon(it.area, { color: c, weight: 2, fillOpacity: .22 });
        else if (it.circle) g = Lf.circle(it.circle.at, { radius: it.circle.km * 1000, color: c, weight: 2, fillOpacity: .15 });
        if (!g) return;
        const dir = it.dir || (it.at ? 'right' : 'center');
        g.bindTooltip(esc(it.label || it.title), { permanent: true, direction: dir, className: 'map-tip', offset: it.at ? [dir === 'left' ? -14 : 14, 0] : [0, 0] });
        g.on('click', () => show(el, i, true));
        g.addTo(map); lay[i] = g;
        if (it.labelAt && !it.at) g.openTooltip(it.labelAt); // шугамын шошгыг сонгосон цэгт
        const li = $$('.map-list button', el)[i]; if (li) li.classList.add('seen');
      }
      $$('.map-list button', el).forEach((b, k) => b.classList.toggle('on', k === i));
      $('.map-info', el).innerHTML = `<h3>${i + 1}. ${esc(it.title)}</h3><div>${md(it.text || '')}</div>`;
      if (fly) {
        if (it.at) map.flyTo(it.at, it.zoom || Math.max(map.getZoom(), s.focusZoom || 6), { duration: .8 });
        else map.flyToBounds(lay[i].getBounds(), { padding: [40, 40], duration: .8, maxZoom: it.zoom || 8 });
      }
    };
    return {
      html: `${head(s)}<div class="s-body"><div class="col map-col"><div class="lmap"></div><div class="base-sw"></div></div>
        <div class="col map-side">${s.text ? `<div class="txt" style="font-size:18px">${textBlock(s.text)}</div>` : ''}
          <div class="map-list">${s.items.map((it, i) => `<button data-i="${i}"><b>${i + 1}</b>${esc(it.title)}</button>`).join('')}</div>
          <div class="card map-info"><p class="muted" style="margin:0">«Дараагийнх» эсвэл жагсаалтаас сонгож газрын зураг дээр харуулна.</p></div>
          <div class="row"><button class="btn pri" data-a="nx">Дараагийнх ▶</button><button class="btn" data-a="all">Бүгд</button><button class="btn" data-a="home" title="Эхний харагдац">⌂</button></div></div></div>`,
      init(el) {
        $$('.map-list button', el).forEach(b => { b.onclick = () => show(el, +b.dataset.i, true); });
        $('[data-a=nx]', el).onclick = () => { const i = s.items.findIndex((_, k) => !lay[k]); show(el, i < 0 ? 0 : i, true); };
        $('[data-a=all]', el).onclick = () => { s.items.forEach((_, k) => show(el, k, false)); if (map) map.fitBounds(Lf.featureGroup(lay.filter(Boolean)).getBounds(), { padding: [30, 30] }); };
        $('[data-a=home]', el).onclick = () => { if (!map) return; const v = s.view || {}; if (v.bounds) map.flyToBounds(v.bounds, { duration: .6 }); else map.flyTo(v.center, v.zoom); };
      },
      enter(el) {
        if (map) { setTimeout(() => map.invalidateSize(), 50); return; }
        const box = $('.lmap', el);
        leaflet().then(lf => { Lf = lf; map = makeMap(Lf, box, s); if (s.showAll) $('[data-a=all]', el).click(); }).catch(e => mapErr(box, e));
      }
    };
  };

  // Газрын зураг дээрээс олох тоглоом: items [{q, at:[ө,у], tol: км (150), e?}]
  R.mapquiz = s => {
    let map = null, Lf = null, i = 0, marks = [];
    const view = el => {
      const q = s.items[i];
      $('.mq-q', el).innerHTML = `<div class="qcount">${i + 1} / ${s.items.length}</div><p class="game-q" style="font-size:28px">${md(q.q)}</p><p class="muted" style="margin:0;font-size:17px">👆 Газрын зураг дээр дарж байршлыг заа (${q.tol || s.tol || 150} км-ийн дотор бол зөв).</p>`;
      $('.mq-res', el).innerHTML = '';
      marks.forEach(m => m.remove()); marks = [];
      if (map) { const v = s.view || {}; if (v.bounds) map.fitBounds(v.bounds); else map.setView(v.center, v.zoom); }
    };
    const guess = (el, e) => {
      if (marks.length) return;
      const q = s.items[i], tol = q.tol || s.tol || 150, d = map.distance(e.latlng, q.at) / 1000, ok = d <= tol;
      marks.push(Lf.marker(e.latlng, { icon: pin(Lf, '?', ok ? 'var(--ok)' : 'var(--bad)') }).addTo(map));
      marks.push(Lf.marker(q.at, { icon: pin(Lf, '✓', '#ffd43b') }).bindTooltip(esc(q.label || 'Зөв байршил'), { permanent: true, direction: 'right', className: 'map-tip', offset: [14, 0] }).addTo(map));
      marks.push(Lf.polyline([e.latlng, q.at], { color: ok ? '#3ddc97' : '#ff6b6b', dashArray: '6 6', weight: 3 }).addTo(map));
      $('.mq-res', el).innerHTML = `<div class="expl" style="border-color:${ok ? 'var(--ok)' : 'var(--bad)'}">${ok ? '✔ Зөв!' : '✘ Холдсон.'} Зөрүү ≈ <b>${Math.round(d)} км</b>.${q.e ? ' ' + md(q.e) : ''}</div>`;
      if (ok) { toast('Зөв! Багт оноо нэмээрэй (+)'); confetti(); }
    };
    return {
      html: `${head(s)}<div class="s-body"><div class="col map-col"><div class="lmap"></div><div class="base-sw"></div></div>
        <div class="col map-side"><div class="mq-q"></div><div class="mq-res"></div>
          <div class="row"><button class="btn pri" data-a="nq">Дараагийн асуулт ▶</button><button class="btn" data-a="rs">↺ Дахин</button></div></div></div>`,
      init(el) {
        view(el);
        $('[data-a=nq]', el).onclick = () => { if (i < s.items.length - 1) { i++; view(el); } else toast('Асуулт дууслаа'); };
        $('[data-a=rs]', el).onclick = () => view(el);
      },
      enter(el) {
        if (map) { setTimeout(() => map.invalidateSize(), 50); return; }
        const box = $('.lmap', el);
        leaflet().then(lf => { Lf = lf; map = makeMap(Lf, box, Object.assign({ bases: ['topo', 'sat'] }, s), e => guess(el, e)); }).catch(e => mapErr(box, e));
      }
    };
  };

  /* ---------------- Хүрээ, удирдлага ---------------- */
  function setTheme(th) {
    const r = document.documentElement.style;
    r.setProperty('--bg', th.bg); r.setProperty('--c1', th.c1); r.setProperty('--c2', th.c2); r.setProperty('--c3', th.c3 || '#ffb627');
    r.setProperty('--c4', th.c4 || '#7bd88f'); r.setProperty('--c5', th.c5 || '#ffd166'); r.setProperty('--hi', th.hi || th.c2);
    const m = motif(th.motif, th.motifColor || th.c1);
    $('#bgfx .motif').style.backgroundImage = m.image; if (m.size) { $('#bgfx .motif').style.backgroundSize = m.size; $('#bgfx .motif').style.backgroundRepeat = 'repeat-x'; $('#bgfx .motif').style.backgroundPosition = 'bottom'; }
  }
  function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 720); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
  const mmss = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  function tickUI() { $('.clock .t').textContent = mmss(timer.sec); $('.clock').classList.toggle('over', timer.sec > 2400); $('.clock button').textContent = timer.on ? '⏸' : '▶'; }
  function toggleTimer() { timer.on = !timer.on; clearInterval(timer.id); if (timer.on) timer.id = setInterval(() => { timer.sec++; tickUI(); }, 1000); tickUI(); toast(timer.on ? 'Цаг явж байна' : 'Цаг зогслоо'); }

  function drawTeams() {
    const box = $('.teams');
    box.innerHTML = teams.map((t, i) => `<div class="team" style="--tc:${t.color}" data-i="${i}"><span>${esc(t.name)}</span><span class="sc">${t.score}</span><button class="minus" data-d="-1">−</button><button class="plus" data-d="1">+</button></div>`).join('') +
      `<div class="set">Баг: <button data-n="-1">−</button><b>${teams.length}</b><button data-n="1">+</button><button data-z title="Оноог тэглэх">↺</button></div>`;
    $$('.team button', box).forEach(b => { b.onclick = () => addPoint(+b.closest('.team').dataset.i, +b.dataset.d); });
    $$('[data-n]', box).forEach(b => { b.onclick = () => setTeams(teams.length + +b.dataset.n); });
    $('[data-z]', box).onclick = () => { teams.forEach(t => { t.score = 0; }); saveTeams(); drawTeams(); };
  }
  function addPoint(i, d) { const t = teams[i]; if (!t) return; t.score = Math.max(0, t.score + d); saveTeams(); drawTeams(); const el = $$('.team')[i]; if (el) el.classList.add('bump'); }
  function setTeams(n) { n = Math.max(2, Math.min(6, n)); while (teams.length < n) { const k = teams.length; teams.push({ name: TEAM_NAMES[k], color: TEAM_COLORS[k], score: 0 }); } teams.length = n; saveTeams(); drawTeams(); }
  const saveTeams = () => store.set('teams-' + L.code, teams);

  function go(n) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    const prev = slides[cur];
    if (prev) prev.el.classList.remove('on');
    cur = n; const s = slides[cur];
    s.el.classList.add('on');
    if (s.enter) s.enter(s.el);
    const st = s.data.stage || 1;
    $$('.chip').forEach((c, i) => { c.classList.toggle('on', i + 1 === st); c.classList.toggle('done', i + 1 < st); });
    $$('.bottom .dots i').forEach((d, i) => d.classList.toggle('on', i === cur));
    $('.count').textContent = `${cur + 1} / ${slides.length}`;
    document.body.classList.toggle('game', st === 3 && L.teams !== false);
    const nt = s.data.notes, mins = s.data.min ? `⏱ ${s.data.min} мин · ` : '';
    $('.notes').innerHTML = `<h4>Багшид · ${esc(STAGES[st - 1].name)}</h4><div>${mins}${md(nt || 'Тэмдэглэл алга.')}</div>`;
    store.set('slide-' + L.code, cur);
  }

  function boot() {
    if (!L) { document.body.textContent = 'Хичээлийн өгөгдөл алга.'; return; }
    document.title = `${L.grade}-р анги · ${L.code} ${L.title}`;
    document.body.innerHTML = `<div id="bgfx"><div class="glow"></div><div class="motif"></div></div>
      <div id="stage"><div class="top"><div class="brand"><i>${L.icon || '🌍'}</i><span>${esc(L.code)} ${esc(L.title)}</span></div><div class="chips">${STAGES.map(s => `<button class="chip" style="--sc:${stageColor(s.n)}" data-st="${s.n}">${s.icon} ${s.name} <small>${s.min}′</small></button>`).join('')}</div>
        <div class="clock" title="Хичээлийн цаг (T)"><span class="t">00:00</span><span class="tot">/ 40:00</span><button>▶</button></div></div>
        <div class="teams"></div><div class="view"><div class="notes"></div></div>
        <div class="bottom"><button class="tool" data-a="prev">◀ Өмнөх</button><span class="count"></span><div class="dots"></div><button class="tool" data-a="notes" title="N">📝 Тэмдэглэл</button><button class="tool" data-a="full" title="F">⛶</button><button class="tool pri" data-a="next">Дараах ▶</button></div></div>
      <div class="toast"></div>`;
    setTheme(L.theme);
    const view = $('.view');
    slides = [{ type: 'title', stage: 1, notes: L.notes }].concat(L.slides).map((d, i) => {
      if (!d.stage) d.stage = 1;
      const r = (R[d.type] || R.concept)(d);
      const el = document.createElement('section');
      el.className = `slide ${d.type}-s`; el.style.setProperty('--sc', stageColor(d.stage)); el.innerHTML = r.html;
      view.insertBefore(el, $('.notes'));
      if (r.init) r.init(el);
      return { el, data: d, enter: r.enter };
    });
    $('.bottom .dots').innerHTML = slides.map((s, i) => `<i style="--sc:${stageColor(s.data.stage)}" class="st" title="${esc(s.data.title || 'Нүүр')}" data-i="${i}"></i>`).join('');
    $$('.bottom .dots i').forEach(d => { d.onclick = () => go(+d.dataset.i); });
    $$('.chip').forEach(c => { c.onclick = () => go(slides.findIndex(s => s.data.stage === +c.dataset.st)); });
    $('[data-a=prev]').onclick = () => go(cur - 1);
    $('[data-a=next]').onclick = () => go(cur + 1);
    $('[data-a=notes]').onclick = () => document.body.classList.toggle('shownotes');
    $('[data-a=full]').onclick = full;
    $('.clock button').onclick = toggleTimer;
    teams = store.get('teams-' + L.code, null) || [];
    if (!teams.length) setTeams(4); else drawTeams();
    // Нуугдсан цонхонд resize ирэхгүй тул хэмжээний өөрчлөлтийг бас ажиглана.
    addEventListener('resize', fit); document.addEventListener('visibilitychange', fit);
    if (W.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
    fit();
    addEventListener('keydown', e => {
      if (/input|textarea|select/i.test(e.target.tagName)) return;
      if (['ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); go(cur + 1); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
      else if (e.key === 'n' || e.key === 'N' || e.key === 'т') document.body.classList.toggle('shownotes');
      else if (e.key === 'f' || e.key === 'F' || e.key === 'ф') full();
      else if (e.key === 't' || e.key === 'T') toggleTimer();
      else if (document.body.classList.contains('game') && /^[1-6]$/.test(e.key)) addPoint(+e.key - 1, 1);
    });
    tickUI();
    // Хаягийн төгсгөлд #s=5 гэвэл 5 дахь слайдаас эхэлнэ.
    const hs = /s=(\d+)/.exec(location.hash);
    go(hs ? +hs[1] - 1 : Math.min(store.get('slide-' + L.code, 0), slides.length - 1));
  }
  function full() {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!rq) return toast('Бүтэн дэлгэц боломжгүй');
    try { const p = rq.call(el); if (p && p.catch) p.catch(() => toast('Бүтэн дэлгэц боломжгүй')); } catch (e) { toast('Бүтэн дэлгэц боломжгүй'); }
  }
  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
<script>// 8-р анги · IV бүлэг · 4.3 Нуур (СБ 61–63: нуур; СБ 69 дасгал)
const TURQ = '#5eead4', SALT = '#ff9ec7', ICE43 = '#bfe9ff', LAKE43 = '#38bdf8', SAND43 = '#e7d3a1';

const cm43 = v => String(v).replace('.', ',');
const hl43 = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 15}" font-weight="800" text-anchor="${o.anchor || 'middle'}" fill="${o.color || '#fff'}" stroke="${o.halo || '#0d1630'}" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${String(t).split('|').map((p, i) => `<tspan x="${x}" dy="${i ? '1.15em' : 0}">${p}</tspan>`).join('')}</text>`;
const mk43 = (id, c) => `<marker id="${id}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;

  [42.6, 110.4], [42.45, 109.0], [42.5, 107.5], [42.1, 106.0], [41.583, 105.0],
  [41.9, 104.0], [42.2, 102.5], [42.55, 101.5], [42.6, 100.0], [42.65, 98.0], [42.8, 96.5], [43.3, 95.9], [44.2, 95.4], [44.4, 94.5], [44.95, 93.5], [45.1, 92.0], [45.2, 91.0], [45.6, 90.7], [46.3, 91.0], [47.0, 90.4], [47.6, 90.1], [47.9, 89.5], [48.05, 88.6], [48.3, 88.1], [48.583, 87.733]];
const LCC = (() => {
  const p1 = rad43(45), p2 = rad43(49), t = p => Math.tan(Math.PI / 4 + p / 2);
  const n = Math.log(Math.cos(p1) / Math.cos(p2)) / Math.log(t(p2) / t(p1)), F = Math.cos(p1) * Math.pow(t(p1), n) / n;
  return (la, lo) => { const rho = F / Math.pow(t(rad43(la)), n), th = n * rad43(lo - 104); return [rho * Math.sin(th), -rho * Math.cos(th)]; };
})();
function mkMap(x0, y0, w, h, b) {
  const pts = [];
  for (let i = 0; i <= 20; i++) { const lo = b[2] + (b[3] - b[2]) * i / 20, la = b[0] + (b[1] - b[0]) * i / 20; pts.push(LCC(b[0], lo), LCC(b[1], lo), LCC(la, b[2]), LCC(la, b[3])); }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), mnx = Math.min(...xs), mxx = Math.max(...xs), mny = Math.min(...ys), mxy = Math.max(...ys);
  const k = Math.min(w / (mxx - mnx), h / (mxy - mny)), ox = x0 + (w - k * (mxx - mnx)) / 2, oy = y0 + (h - k * (mxy - mny)) / 2;
  const P = (la, lo) => { const [X, Y] = LCC(la, lo); return [+(ox + k * (X - mnx)).toFixed(1), +(oy + k * (mxy - Y)).toFixed(1)]; };
  return { P, shape: 'M' + MN.map(([la, lo]) => P(la, lo).join(' ')).join('L') + 'Z' };
}

function lakeMap(x0, y0, w, h, o = {}) {
  const M = mkMap(x0, y0, w, h, [41.3, 52.4, 87.4, 120.2]);
  let s = `<path d="${M.shape}" fill="${o.fill || 'rgba(231,211,161,.22)'}" stroke="${SAND43}" stroke-width="2.5" stroke-linejoin="round"/>`;
  Object.values(LK).forEach(([la, lo, a, rot, e]) => {
    const [x, y] = M.P(la, lo), r = Math.max(3.2, Math.sqrt(a) * (o.k || .26));
    s += `<ellipse cx="${x}" cy="${y}" rx="${(r * Math.sqrt(e)).toFixed(1)}" ry="${(r / Math.sqrt(e)).toFixed(1)}" transform="rotate(${rot} ${x} ${y})" fill="${LAKE43}" stroke="#e0f7ff" stroke-width="1.2"/>`;
  });
  return { M, s };
}
